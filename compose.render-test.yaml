# Isolated local verification of the Render image. Never uses the project's .env or real DB.
services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg16-bookworm
    environment:
      POSTGRES_USER: render_test
      POSTGRES_PASSWORD: render_test
      POSTGRES_DB: render_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U render_test -d render_test]
      interval: 2s
      timeout: 5s
      retries: 20
  app:
    build:
      context: .
      dockerfile: Dockerfile.render
    mem_limit: 512m
    memswap_limit: 512m # No swap headroom: enforce the actual 512 MiB memory budget.
    cpus: 0.5
    environment:
      PORT: '10000'
      DATABASE_URL: postgresql://render_test:render_test@postgres:5432/render_test
      COOKIE_SECRET: render-test-only-cookie-signing-secret
      COOKIE_SECURE: 'false' # Test browser uses HTTP; render.yaml uses true for HTTPS.
      LLM_PROVIDER: mock
    ports:
      - '127.0.0.1:3003:10000'
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 90s
